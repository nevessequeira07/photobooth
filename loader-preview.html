<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding loader preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fffaf6;color:#8d564e;font-family:system-ui,sans-serif}.preview{text-align:center;padding:30px}.stage{height:190px;width:260px;position:relative;margin:auto;display:flex;align-items:end;justify-content:center;gap:0;padding-bottom:20px}.person{font-size:92px;line-height:1.2;transform-origin:50% 95%;animation:dance 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 3px #8d564e15)}.bride{animation-delay:-.8s}.floor{position:absolute;bottom:12px;width:190px;height:12px;background:#eadbd3;border-radius:50%;opacity:.5}.heart{position:absolute;left:120px;top:38px;color:#b47c6c;font-size:20px;animation:float 2.4s ease-out infinite}.heart:nth-child(2){left:75px;animation-delay:-.8s;font-size:14px}.heart:nth-child(3){left:170px;animation-delay:-1.6s;font-size:16px}h1{font:normal 27px Georgia,serif;margin:24px 0 10px}p{font-size:13px;color:#80665e;margin:0}.dots{display:flex;justify-content:center;gap:7px;margin-top:23px}.dots i{width:5px;height:5px;border-radius:50%;background:#ac7465;animation:pulse 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}.note{margin-top:50px;font-size:11px;color:#80665e}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg)}25%{transform:translateY(-7px) rotate(0)}50%{transform:translateY(0) rotate(8deg)}75%{transform:translateY(-7px) rotate(0)}}@keyframes float{0%{opacity:0;transform:translateY(25px) scale(.7)}25%{opacity:.8}100%{opacity:0;transform:translateY(-38px) scale(1.1)}}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.heart{opacity:.6}}
</style><main class="preview"><div class="stage" aria-hidden="true"><div class="floor"></div><span class="heart">&#9829;</span><span class="heart">&#9829;</span><span class="heart">&#9829;</span><span class="person groom">🤵🏻</span><span class="person bride">👰🏻</span></div><h1>A little dance while you wait…</h1><p>Gathering our favorite moments</p><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div></main></html>
